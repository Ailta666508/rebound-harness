<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">Rebound Harness architecture</title>
  <desc id="desc">A planner and local inspector connect to a durable runtime. The runtime journals intent before tool dispatch and reconciles evidence after uncertain outcomes. In experiments an evaluator observes provider effect state separately from the recovery policy.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52797a"/></marker>
    <marker id="mint" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17856f"/></marker>
  </defs>
  <rect width="1280" height="660" rx="18" fill="#f6f8f5"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="42" y="47" font-size="12" font-weight="700" letter-spacing="2" fill="#52746f">ARCHITECTURE</text>
    <text x="42" y="86" font-size="29" font-weight="700" fill="#203a3e">A narrow runtime. A visible recovery boundary.</text>
    <text x="42" y="115" font-size="14" fill="#647778">External effects and local knowledge are recorded separately.</text>

    <rect x="42" y="172" width="240" height="112" rx="13" fill="#fff" stroke="#ccd8d4"/>
    <text x="62" y="205" font-size="18" font-weight="700" fill="#203a3e">Agent / workflow</text>
    <text x="62" y="232" font-size="13" fill="#647778">Model adapter or scripted plan</text>
    <text x="62" y="256" font-size="12" fill="#647778">Typed steps · tools · limits</text>

    <rect x="42" y="339" width="240" height="112" rx="13" fill="#fff" stroke="#ccd8d4"/>
    <text x="62" y="372" font-size="18" font-weight="700" fill="#203a3e">CLI + local inspector</text>
    <text x="62" y="399" font-size="13" fill="#647778">Runs, decisions, and event history</text>
    <text x="62" y="423" font-size="12" fill="#647778">Read / inspect · explicit resume</text>

    <rect x="365" y="172" width="477" height="279" rx="16" fill="#123a3c"/>
    <rect x="389" y="193" width="129" height="24" rx="12" fill="#285052"/>
    <text x="403" y="209" font-size="10" font-weight="700" letter-spacing="1.2" fill="#b1e4d4">DURABLE RUNTIME</text>
    <text x="389" y="252" font-size="25" font-weight="700" fill="#f2f7f3">Execution + recovery policy</text>
    <rect x="389" y="279" width="130" height="77" rx="8" fill="#205052"/>
    <text x="405" y="309" font-size="15" font-weight="650" fill="#b6e8d5">Intent</text>
    <text x="405" y="333" font-size="11" fill="#b0c8c5">persist before I/O</text>
    <rect x="536" y="279" width="130" height="77" rx="8" fill="#205052"/>
    <text x="552" y="309" font-size="15" font-weight="650" fill="#b6e8d5">Execute</text>
    <text x="552" y="333" font-size="11" fill="#b0c8c5">stable operation ID</text>
    <rect x="683" y="279" width="135" height="77" rx="8" fill="#205052"/>
    <text x="699" y="309" font-size="15" font-weight="650" fill="#b6e8d5">Reconcile</text>
    <text x="699" y="333" font-size="11" fill="#b0c8c5">validate evidence</text>
    <text x="389" y="392" font-size="13" fill="#e3bc79">UNKNOWN is a durable state.</text>
    <text x="389" y="422" font-size="12" fill="#b0c8c5">Continue · retry by contract · wait · request review</text>

    <rect x="928" y="172" width="310" height="128" rx="13" fill="#fff" stroke="#ccd8d4"/>
    <text x="949" y="204" font-size="18" font-weight="700" fill="#203a3e">Tool adapter / provider</text>
    <text x="949" y="233" font-size="13" fill="#647778">execute(operation_id, arguments)</text>
    <text x="949" y="258" font-size="13" fill="#17856f">probe(operation_id) → evidence</text>
    <text x="949" y="282" font-size="11" fill="#647778">Idempotency and authority are contracts.</text>

    <rect x="928" y="360" width="310" height="91" rx="13" fill="#edf2ef" stroke="#ccd8d4"/>
    <text x="949" y="394" font-size="18" font-weight="700" fill="#203a3e">Provider effect state</text>
    <text x="949" y="424" font-size="13" fill="#647778">What actually happened externally</text>

    <path d="M282 228H353" fill="none" stroke="#52797a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M282 395H353" fill="none" stroke="#52797a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M842 227H916" fill="none" stroke="#52797a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M928 270H855" fill="none" stroke="#17856f" stroke-width="2" marker-end="url(#mint)"/>
    <path d="M1083 300V348" fill="none" stroke="#52797a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="365" y="505" width="477" height="100" rx="13" fill="#e6efe9" stroke="#bacfc3"/>
    <text x="388" y="540" font-size="19" font-weight="700" fill="#203a3e">SQLite WAL journal</text>
    <text x="388" y="570" font-size="13" fill="#647778">Runs + operations + results + decision events</text>
    <text x="388" y="591" font-size="11" fill="#647778">Local transactions; no atomic transaction with the provider</text>
    <path d="M604 451V493" fill="none" stroke="#52797a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="928" y="505" width="310" height="100" rx="13" fill="#fbf0dc" stroke="#dfcb9d"/>
    <text x="949" y="539" font-size="18" font-weight="700" fill="#5e4c2d">Independent evaluator</text>
    <text x="949" y="568" font-size="12" fill="#7d6944">Completion · duplicates · missing effects</text>
    <text x="949" y="590" font-size="11" fill="#7d6944">Hidden oracle is unavailable to the policy.</text>
    <path d="M1083 451V493" fill="none" stroke="#a28b5f" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="43" y="573" font-size="11" fill="#71827f">CONTROLLED EXPERIMENT</text>
    <text x="43" y="595" font-size="12" fill="#71827f">Separate observations from ground truth.</text>
  </g>
</svg>
