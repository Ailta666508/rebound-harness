name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e '.[dev,benchmark,mcp]'
      - run: ruff check src tests examples
      - run: mypy src/rebound
      - run: pytest -q
  inspector-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser and persistence smoke test
        env:
          QA_SCREENSHOT_DIR: ${{ github.workspace }}/work/visual-qa
        run: |
          rebound serve --data /tmp/rebound-ci --port 8787 > /tmp/rebound-serve.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/health && break || sleep 1; done
          cd frontend
          node e2e/smoke.mjs
      - run: python -m build
      - name: Check installed wheel includes the inspector
        run: |
          python -m venv /tmp/rebound-wheel
          /tmp/rebound-wheel/bin/pip install dist/*.whl
          /tmp/rebound-wheel/bin/python -c "from importlib.resources import files; assert files('rebound').joinpath('static/index.html').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspector-screenshots
          path: docs/assets/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagram-previews
          path: work/visual-qa/*.png
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: docker pull python:3.12-slim
      - run: REBOUND_TEST_DOCKER=1 pytest tests/test_runtime.py -k real_docker -q
      - run: REBOUND_TEST_DOCKER=1 pytest tests/test_docker.py -q
